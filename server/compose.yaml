services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orange
      POSTGRES_USER: orange
      POSTGRES_PASSWORD: orange_dev_only
    ports:
      - "5432:5432"
    volumes:
      - orange-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange -d orange"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://orange:orange_dev_only@database:5432/orange
      BIND_ADDR: 0.0.0.0:8080
      SESSION_TTL_DAYS: 30
      ORANGE_CORS_ORIGINS: http://localhost:3000
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  orange-postgres:
